<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Numeral Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Roman Numeral Converter</h2>

    <label for="numInput">Enter an integer (0 – 100,000):</label>
    <input type="number" id="numInput" min="0" max="100000" placeholder="e.g. 798" value="798">

    <button id="convertBtn">Convert</button>

    <h3>Roman Numeral:</h3>
    <div id="result" class="result-box">DCCXCVIII</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
